services:
  - type: web
    name: devsphere-backend
    runtime: docker
    repo: https://github.com/Ajaykumarnachimuthu/DevSphere
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/projects
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DEVSphere_DB_URL
        sync: false
      - key: DEVSphere_DB_USERNAME
        sync: false
      - key: DEVSphere_DB_PASSWORD
        sync: false
      - key: DEVSphere_JWT_SECRET
        value: 4c9b1d75f284e60183b9e4a7d6c518293f0b4d7e1c8a5f3962b0e8c71d4a6f95
      - key: DEVSphere_CORS_ORIGINS
        value: https://dev-sphere-eight.vercel.app,http://localhost:5173
