server.port=8083
spring.application.name=blog-service

# Database Configuration (PostgreSQL in production, persistent H2 file in dev)
spring.datasource.url=${DEVSphere_BLOG_DB_URL:jdbc:h2:file:./data/blogdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DEVSphere_BLOG_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DEVSphere_BLOG_DB_USERNAME:sa}
spring.datasource.password=${DEVSphere_BLOG_DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Internal Security
devsphere.internal.secret=${DEVSphere_INTERNAL_SECRET:devsphere-hybrid-internal-key-2026}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
