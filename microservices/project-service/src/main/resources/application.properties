server.port=${PROJECT_SERVICE_PORT:8082}
spring.application.name=project-service

# Database Configuration (PostgreSQL in production, persistent H2 file in dev)
spring.datasource.url=${DEVSphere_PROJECT_DB_URL:jdbc:h2:file:./data/projectdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DEVSphere_PROJECT_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DEVSphere_PROJECT_DB_USERNAME:sa}
spring.datasource.password=${DEVSphere_PROJECT_DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Internal Cryptographic Token Security
devsphere.internal.secret=${DEVSphere_INTERNAL_SECRET:devsphere-hybrid-internal-key-2026}
devsphere.service.name=project-service

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
