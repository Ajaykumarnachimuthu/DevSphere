# DEVSphere Spring Boot Configuration
spring.application.name=devsphere-backend

# Default Profile
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.servlet.context-path=

# Production Database (PostgreSQL)
spring.datasource.url=${DEVSphere_DB_URL:jdbc:postgresql://localhost:5432/devsphere}
spring.datasource.username=${DEVSphere_DB_USERNAME:postgres}
spring.datasource.password=${DEVSphere_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security & JWT
devsphere.jwt.secret=${DEVSphere_JWT_SECRET:4c9b1d75f284e60183b9e4a7d6c518293f0b4d7e1c8a5f3962b0e8c71d4a6f95}
devsphere.jwt.expiration-ms=86400000

# CORS
devsphere.cors.allowed-origins=${DEVSphere_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
