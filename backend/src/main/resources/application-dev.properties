# Development Profile Configuration
# Primary: Connected directly to Supabase Cloud PostgreSQL
spring.datasource.url=${DEVSphere_DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DEVSphere_DB_USERNAME:postgres.rtugpdrmlscbrmbtpqvh}
spring.datasource.password=${DEVSphere_DB_PASSWORD:Ajaykumar2007}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Logging
logging.level.com.devsphere=INFO
logging.level.org.springframework.security=INFO

# Hybrid Microservices Architecture Configuration
devsphere.services.blog.base-url=${BLOG_SERVICE_BASE_URL:http://localhost:8081}
devsphere.services.blog.timeout-ms=${BLOG_SERVICE_TIMEOUT_MS:5000}
devsphere.services.project.base-url=${PROJECT_SERVICE_BASE_URL:http://localhost:8082}
devsphere.services.project.timeout-ms=${PROJECT_SERVICE_TIMEOUT_MS:5000}
devsphere.internal.secret=${DEVSphere_INTERNAL_SECRET:devsphere-hybrid-internal-key-2026}
