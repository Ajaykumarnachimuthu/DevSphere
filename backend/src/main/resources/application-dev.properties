# Development Profile Configuration
# If DEVSphere_DB_URL is provided, it uses PostgreSQL. Otherwise, it gracefully falls back to an embedded PostgreSQL-mode database.
spring.datasource.url=${DEVSphere_DB_URL:jdbc:h2:file:./data/devspheredb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DEVSphere_DB_USERNAME:sa}
spring.datasource.password=${DEVSphere_DB_PASSWORD:}
spring.datasource.driver-class-name=${DEVSphere_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway: Disabled in dev fallback if using H2 file auto-ddl, or enabled with PostgreSQL
spring.flyway.enabled=false

# Enable H2 console for easy inspection during development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging
logging.level.com.devsphere=DEBUG
logging.level.org.springframework.security=INFO
